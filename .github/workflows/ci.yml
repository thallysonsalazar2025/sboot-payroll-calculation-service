name: Pull Request CI

on:
  pull_request:
    branches:
      - master
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, tests and security validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Validate Maven project
        run: mvn --batch-mode --no-transfer-progress validate

      - name: Compile and run tests
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Enforce changed-code coverage
        if: github.event_name == 'pull_request'
        run: >-
          python scripts/check-diff-coverage.py
          --base "${{ github.event.pull_request.base.sha }}"
          --report target/site/jacoco/jacoco.xml

      - name: Verify negative coverage fixture
        run: python scripts/check-diff-coverage.py --self-test

      - name: Dependency vulnerability scan
        run: >-
          mvn --batch-mode --no-transfer-progress
          org.owasp:dependency-check-maven:12.1.3:check

      - name: Verify required reports
        if: always()
        shell: bash
        run: |
          test -s target/site/jacoco/jacoco.xml
          test -s target/site/jacoco/index.html
          test -s target/dependency-check-report.html
          test -s target/dependency-check-report.json

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-and-coverage-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
            target/site/jacoco
          if-no-files-found: error
          retention-days: 14

      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-check-report
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
          if-no-files-found: error
          retention-days: 14
